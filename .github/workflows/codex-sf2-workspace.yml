name: SF2 workspace helper

on:
  push:
    branches: [codex/sf2-correctness-work]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Archive workspace
        run: tar --exclude=.git -czf /tmp/svms-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: svms-workspace
          path: /tmp/svms-workspace.tar.gz
          if-no-files-found: error
