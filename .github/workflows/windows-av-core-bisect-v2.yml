name: Windows Configurator AV core bisect v2

on:
  workflow_dispatch:
  push:
    branches: [v3]
    paths:
      - ".github/workflows/windows-av-core-bisect-v2.yml"

jobs:
  build:
    name: Build core Configurator isolation samples
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up output
        shell: pwsh
        run: New-Item -ItemType Directory -Force av-core | Out-Null

      - name: Stub feature pages and services
        shell: pwsh
        run: |
          @'
          #include "ConfigDocument.h"
          #include "PageOverview.h"
          #include "imgui.h"
          namespace svms::cfg { void DrawOverviewPage(ConfigDocument&) { ImGui::TextDisabled("Overview stub"); } }
          '@ | Set-Content -Encoding utf8 src/V3/Configurator/PageOverview.cpp

          @'
          #include "ConfigDocument.h"
          #include "EasterEggs.h"
          #include "PageAudio.h"
          #include "imgui.h"
          namespace svms::cfg { void DrawAudioPage(ConfigDocument&, const EasterEggState&) { ImGui::TextDisabled("Audio stub"); } }
          '@ | Set-Content -Encoding utf8 src/V3/Configurator/PageAudio.cpp

          @'
          #include "ConfigDocument.h"
          #include "PagePerformance.h"
          #include "imgui.h"
          namespace svms::cfg { void DrawPerformancePage(ConfigDocument&) { ImGui::TextDisabled("Performance stub"); } }
          '@ | Set-Content -Encoding utf8 src/V3/Configurator/PagePerformance.cpp

          @'
          #include "ConfigDocument.h"
          #include "PageMidi.h"
          #include "imgui.h"
          namespace svms::cfg { void DrawMidiPage(ConfigDocument&) { ImGui::TextDisabled("MIDI stub"); } }
          '@ | Set-Content -Encoding utf8 src/V3/Configurator/PageMidi.cpp

          @'
          #include "ConfigDocument.h"
          #include "PageReverb.h"
          #include "imgui.h"
          namespace svms::cfg { void DrawReverbPage(ConfigDocument&) { ImGui::TextDisabled("Reverb stub"); } }
          '@ | Set-Content -Encoding utf8 src/V3/Configurator/PageReverb.cpp

          @'
          #include "ConfigDocument.h"
          #include "PageLimiter.h"
          #include "imgui.h"
          namespace svms::cfg { void DrawLimiterPage(ConfigDocument&) { ImGui::TextDisabled("Limiter stub"); } }
          '@ | Set-Content -Encoding utf8 src/V3/Configurator/PageLimiter.cpp

          @'
          #include "ConfigDocument.h"
          #include "PageDiagnostics.h"
          #include "imgui.h"
          namespace svms::cfg { void DrawDiagnosticsPage(ConfigDocument&) { ImGui::TextDisabled("Diagnostics stub"); } }
          '@ | Set-Content -Encoding utf8 src/V3/Configurator/PageDiagnostics.cpp

          @'
          #include "ConfigDocument.h"
          #include "PageAdvanced.h"
          #include "imgui.h"
          namespace svms::cfg { void DrawAdvancedPage(ConfigDocument&) { ImGui::TextDisabled("Advanced stub"); } }
          '@ | Set-Content -Encoding utf8 src/V3/Configurator/PageAdvanced.cpp

          @'
          #include "ConfigDocument.h"
          #include "UpdateService.h"
          #include "PageAbout.h"
          #include "imgui.h"
          namespace svms::cfg { void DrawAboutPage(ConfigDocument&, UpdateService&) { ImGui::TextDisabled("About stub"); } }
          '@ | Set-Content -Encoding utf8 src/V3/Configurator/PageAbout.cpp

          @'
          #include "ConfigDocument.h"
          #include "PageOffline.h"
          #include "imgui.h"
          namespace svms::cfg {
          OfflineRendererPage::~OfflineRendererPage() { Shutdown(); }
          void OfflineRendererPage::Draw(ConfigDocument&, HWND) { ImGui::TextDisabled("Offline renderer stub"); }
          void OfflineRendererPage::Shutdown() { shutdown_ = true; }
          }
          '@ | Set-Content -Encoding utf8 src/V3/Configurator/PageOffline.cpp

          @'
          #include "PageLiveRecording.h"
          #include "imgui.h"
          namespace svms::cfg {
          void LiveRecordingPage::Draw(svms::RuntimeLinkClient*, bool, HWND) { ImGui::TextDisabled("Live recording stub"); }
          }
          '@ | Set-Content -Encoding utf8 src/V3/Configurator/PageLiveRecording.cpp

          @'
          #include "UpdateService.h"
          #include <mutex>
          namespace svms::cfg {
          UpdateService::~UpdateService() { if (worker_.joinable()) worker_.join(); }
          void UpdateService::CheckAsync(bool) { UpdateSnapshot s{}; s.status = UpdateStatus::Failed; s.message = "Update stub"; Publish(s); }
          UpdateSnapshot UpdateService::GetSnapshot() const { std::lock_guard<std::mutex> lock(mutex_); return snapshot_; }
          void UpdateService::CheckWorker(bool) {}
          void UpdateService::Publish(const UpdateSnapshot& s) { std::lock_guard<std::mutex> lock(mutex_); snapshot_ = s; }
          }
          '@ | Set-Content -Encoding utf8 src/V3/Configurator/UpdateService.cpp

          @'
          #include "WasapiDevices.h"
          namespace svms::cfg {
          WasapiDeviceList::WasapiDeviceList() = default;
          WasapiDeviceList::~WasapiDeviceList() = default;
          void WasapiDeviceList::Enumerate() { devices_.clear(); }
          std::vector<std::string> WasapiDeviceList::FriendlyNames() const { return {"Default Windows Output Device"}; }
          int WasapiDeviceList::FindByName(const std::wstring&) const { return 0; }
          int WasapiDeviceList::DefaultIndex() const { return 0; }
          }
          '@ | Set-Content -Encoding utf8 src/V3/Configurator/WasapiDevices.cpp

          @'
          #ifndef SVMS_RUNTIME_LINK_H
          #define SVMS_RUNTIME_LINK_H
          #include "SVMSRuntimeLinkProtocol.h"
          #include "SVMSBuildInfo.h"
          #include <cstdint>
          namespace svms {
          class RuntimeLinkClient {
          public:
              enum class Protocol : uint32_t { None = 0u, V2 = 2u, V3 = 3u };
              struct HostInfo {
                  uint32_t pid = 0u, archClass = 0u, productMajor = 0u, productMinor = 0u,
                           productPatch = 0u, buildNumber = 0u, releaseChannel = 0u,
                           protocolMin = 0u, protocolMax = 0u;
                  uint64_t capabilityFlags = 0u, sessionId = 0u;
                  bool fresh = false, hasVersionIdentity = false;
              };
              bool Open(uint32_t) { return false; }
              void Close() {}
              bool IsOpen() const { return false; }
              uint32_t GetPID() const { return 0u; }
              Protocol GetProtocol() const { return Protocol::None; }
              const HostInfo& GetPeerInfo() const { return peer_; }
              bool HasCapability(uint64_t) const { return false; }
              bool ReadTelemetry(RuntimeLinkTelemetryV2&) { return false; }
              bool IsHostAlive(uint32_t) const { return false; }
              RLResult SendCommand(RLCommandType, uint32_t, uint32_t,
                                   const RuntimeLiveStateV2&, uint32_t,
                                   char[kRuntimeLinkResultTextCapacity] = nullptr,
                                   const char* = nullptr) {
                  return RLResult::InternalError;
              }
              static uint32_t EnumerateHosts(HostInfo*, uint32_t) { return 0u; }
          private:
              HostInfo peer_{};
          };
          }
          #endif
          '@ | Set-Content -Encoding utf8 src/V3/SVMSRuntimeLink.h

      - name: Build CORE with real ConfigDocument
        shell: cmd
        run: |
          call find_vs.bat
          if errorlevel 1 exit /b %errorlevel%
          call "%VS_VCVARSALL%" x64
          if errorlevel 1 exit /b %errorlevel%
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -S src\V3 -B build\av-core-real-config
          if errorlevel 1 exit /b %errorlevel%
          cmake --build build\av-core-real-config --config Release --target svms_v3_configurator
          if errorlevel 1 exit /b %errorlevel%
          copy /y build\av-core-real-config\bin\svms_v3_configurator.exe av-core\01-CORE-REAL-CONFIG.exe >nul

      - name: Stub ConfigDocument file I/O
        shell: pwsh
        run: |
          @'
          #include "ConfigDocument.h"
          namespace svms::cfg {
          void ConfigValidation::AddWarning(const char* field) {
              valid = false;
              if (!warnings.empty()) warnings += "; ";
              warnings += field ? field : "invalid";
          }
          bool ConfigValuesEqual(const ConfigValues&, const ConfigValues&) { return false; }
          ConfigValues ConfigDocument::Defaults() { return ConfigValues{}; }
          bool ConfigDocument::Load(const std::wstring& path) {
              activePath_ = path;
              defaults_ = Defaults(); loaded_ = defaults_; working_ = defaults_;
              rawJson_ = nlohmann::json::object(); loadedRawJson_ = rawJson_;
              parseError_.clear(); configWarning_.clear(); dirty_ = false;
              readOnly_ = false; loadedSchemaVersion_ = 0u; return true;
          }
          bool ConfigDocument::LoadDefaults() { return Load(L""); }
          bool ConfigDocument::Save(const std::wstring& path) {
              activePath_ = path; loaded_ = working_; dirty_ = false; return true;
          }
          bool ConfigDocument::SaveAtomic(const std::wstring& path) { return Save(path); }
          bool ConfigDocument::ImportProfile(const std::wstring&, std::string* error) {
              if (error) error->clear(); return true;
          }
          bool ConfigDocument::ExportProfile(const std::wstring&, std::string* error) const {
              if (error) error->clear(); return true;
          }
          bool ConfigDocument::IsDirty() const { return dirty_; }
          void ConfigDocument::MarkDirty() { dirty_ = true; }
          void ConfigDocument::ClearDirty() { dirty_ = false; }
          void ConfigDocument::Revert() { working_ = loaded_; dirty_ = false; }
          ConfigValidation ConfigDocument::Validate() const { return {}; }
          void ConfigDocument::FromJson(const nlohmann::json&) {}
          nlohmann::json ConfigDocument::ToJson() const { return nlohmann::json::object(); }
          }
          '@ | Set-Content -Encoding utf8 src/V3/Configurator/ConfigDocument.cpp

      - name: Build CORE without ConfigDocument I/O
        shell: cmd
        run: |
          call find_vs.bat
          if errorlevel 1 exit /b %errorlevel%
          call "%VS_VCVARSALL%" x64
          if errorlevel 1 exit /b %errorlevel%
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -S src\V3 -B build\av-core-no-configio
          if errorlevel 1 exit /b %errorlevel%
          cmake --build build\av-core-no-configio --config Release --target svms_v3_configurator
          if errorlevel 1 exit /b %errorlevel%
          copy /y build\av-core-no-configio\bin\svms_v3_configurator.exe av-core\02-CORE-NO-CONFIGIO.exe >nul

      - name: Upload core samples
        uses: actions/upload-artifact@v4
        with:
          name: SVMSConfigurator-AV-core-bisect-v2
          path: av-core/
          if-no-files-found: error
