name: Apply V3 adaptive limiter polish

on:
  push:
    branches: [v3]
    paths:
      - .github/workflows/apply-v3-adaptive-limiter-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3
          fetch-depth: 0

      - name: Apply limiter and meter changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(f"{path}: expected exactly one match, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          limiter = "src/V3/SVMSLimiter.h"

          replace_once(limiter,
          '''        limitingDensity_ = 0.0f;
          delayFrames = ClampDelay(delayFramesTarget);''',
          '''        limitingDensity_ = 0.0f;
          releaseHoldRemaining_ = 0u;
          delayFrames = ClampDelay(delayFramesTarget);''')

          replace_once(limiter,
          '''        averagePeakCoeff_ = TimeToCoeff(20.0f, configuredSampleRate_, 1.0f);
          densityCoeff_ = TimeToCoeff(25.0f, configuredSampleRate_, 1.0f);
          peakMemoryDecay_ = std::exp(-1.0f /
              ((std::max)(1.0f,
                  15.0f * static_cast<float>(configuredSampleRate_) * 0.001f)));

          Reset();''',
          '''        // Program analysis deliberately remembers dense material much longer
          // than it takes to recognize it.  Black-MIDI walls often contain tiny
          // waveform gaps that must not be mistaken for the end of a passage.
          averagePeakCoeff_ = TimeToCoeff(30.0f, configuredSampleRate_, 1.0f);
          densityAttackCoeff_ = TimeToCoeff(15.0f, configuredSampleRate_, 1.0f);
          densityReleaseCoeff_ = TimeToCoeff(220.0f, configuredSampleRate_, 1.0f);
          peakMemoryDecay_ = std::exp(-1.0f /
              ((std::max)(1.0f,
                  80.0f * static_cast<float>(configuredSampleRate_) * 0.001f)));
          releaseHoldFrames_ = (std::max)(1u, static_cast<uint32_t>(
              8.0f * static_cast<float>(configuredSampleRate_) * 0.001f + 0.5f));

          Reset();''')

          replace_once(limiter,
          '''        if (predictiveTarget < currentGain_) {
              currentGain_ += effectiveAttack *
                  (predictiveTarget - currentGain_);
          } else {
              const float adaptiveRelease = ComputeAdaptiveReleaseCoeff();
              currentGain_ += adaptiveRelease *
                  (predictiveTarget - currentGain_);
          }
          currentGain_ = (std::max)(0.0f, (std::min)(1.0f, currentGain_));''',
          '''        if (predictiveTarget < currentGain_) {
              currentGain_ += effectiveAttack *
                  (predictiveTarget - currentGain_);
              // A short hold stops the gain from charging back toward unity in
              // the microscopic gaps between dense peaks.  It is reset only
              // while attenuation is still being requested.
              if (predictiveTarget < 0.995f || currentGain_ < 0.995f)
                  releaseHoldRemaining_ = releaseHoldFrames_;
          } else if (releaseHoldRemaining_ > 0u) {
              --releaseHoldRemaining_;
          } else {
              const float adaptiveRelease = ComputeAdaptiveReleaseCoeff();
              currentGain_ += adaptiveRelease *
                  (predictiveTarget - currentGain_);
          }
          currentGain_ = (std::max)(0.0f, (std::min)(1.0f, currentGain_));''')

          replace_once(limiter,
          '''    void UpdateProgramAnalysis(float peak, float rawRequiredGain) noexcept {
          averagePeak_ += averagePeakCoeff_ * (peak - averagePeak_);
          peakMemory_ = (std::max)(peak, peakMemory_ * peakMemoryDecay_);
          const float demand = 1.0f - rawRequiredGain;
          limitingDensity_ += densityCoeff_ * (demand - limitingDensity_);
      }

      float ComputeAdaptiveReleaseCoeff() const noexcept {
          const float base = ClampCoeff(releaseCoeff);
          if (base <= 0.0f) return 0.0f;

          const float density = (std::max)(0.0f,
              (std::min)(1.0f, limitingDensity_ * 3.0f));
          const float crest = peakMemory_ /
              (std::max)(averagePeak_, 1.0e-5f);
          const float transient = (std::max)(0.0f,
              (std::min)(1.0f, (crest - 1.5f) / 4.5f));

          float timeScale = 0.65f + 1.85f * density;
          timeScale *= 1.0f - 0.35f * transient;
          timeScale = (std::max)(0.35f, (std::min)(3.0f, timeScale));
          return (std::min)(1.0f, base / timeScale);
      }''',
          '''    void UpdateProgramAnalysis(float peak, float rawRequiredGain) noexcept {
          averagePeak_ += averagePeakCoeff_ * (peak - averagePeak_);
          peakMemory_ = (std::max)(peak, peakMemory_ * peakMemoryDecay_);
          const float demand = 1.0f - rawRequiredGain;
          const float densityCoeff = demand > limitingDensity_
              ? densityAttackCoeff_ : densityReleaseCoeff_;
          limitingDensity_ += densityCoeff * (demand - limitingDensity_);
      }

      float ComputeAdaptiveReleaseCoeff() const noexcept {
          const float base = ClampCoeff(releaseCoeff);
          if (base <= 0.0f) return 0.0f;

          const float density = (std::max)(0.0f,
              (std::min)(1.0f, limitingDensity_ * 3.0f));
          const float crest = peakMemory_ /
              (std::max)(averagePeak_, 1.0e-5f);
          const float transient = (std::max)(0.0f,
              (std::min)(1.0f, (crest - 1.5f) / 4.5f));

          // The user Release value is now the fastest normal recovery. Dense
          // passages only stretch it; transient detection is allowed to relax
          // that extra stretch a little, but never make recovery faster than
          // the knob says. At full density the effective time constant is
          // roughly 5.5x the requested release.
          const float densityStretch =
              4.5f * density * (1.0f - 0.18f * transient);
          const float timeScale = (std::max)(1.0f,
              (std::min)(5.5f, 1.0f + densityStretch));

          // Scale the actual one-pole time constant rather than merely
          // dividing the coefficient (the latter is only an approximation for
          // very small coefficients).
          const float oneMinusBase = (std::max)(1.0e-9f, 1.0f - base);
          return ClampCoeff(1.0f - std::exp(
              std::log(oneMinusBase) / timeScale));
      }''')

          replace_once(limiter,
          '''    float averagePeakCoeff_ = 0.001f;
      float densityCoeff_ = 0.001f;
      float peakMemoryDecay_ = 0.999f;

      uint32_t cachedDeadlineFrames_ = UINT32_MAX;''',
          '''    float averagePeakCoeff_ = 0.001f;
      float densityAttackCoeff_ = 0.001f;
      float densityReleaseCoeff_ = 0.0001f;
      float peakMemoryDecay_ = 0.999f;
      uint32_t releaseHoldFrames_ = 1u;
      uint32_t releaseHoldRemaining_ = 0u;

      uint32_t cachedDeadlineFrames_ = UINT32_MAX;''')

          page = "src/V3/Configurator/PageLimiter.cpp"

          replace_once(page,
          '''constexpr float kGrMaxDb = 24.0f;''',
          '''constexpr float kGrBaseMaxDb = 24.0f;
      constexpr float kGrHardMaxDb = 240.0f;''')

          replace_once(page,
          '''float MeterNorm(float linear) {
          const float db = LinearToDb(linear);
          return ImClamp((db - kMeterFloorDb) / -kMeterFloorDb, 0.0f, 1.0f);
      }

      void DrawCenteredText''',
          '''float MeterNorm(float linear) {
          const float db = LinearToDb(linear);
          return ImClamp((db - kMeterFloorDb) / -kMeterFloorDb, 0.0f, 1.0f);
      }

      float SelectGrDisplayMax(float observedDb) {
          if (!std::isfinite(observedDb)) return kGrBaseMaxDb;
          observedDb = ImClamp(observedDb, 0.0f, kGrHardMaxDb);
          if (observedDb <= kGrBaseMaxDb) return kGrBaseMaxDb;
          const float steps = std::ceil(observedDb / kGrBaseMaxDb);
          return ImClamp(steps * kGrBaseMaxDb,
                         kGrBaseMaxDb, kGrHardMaxDb);
      }

      float GrTickStep(float displayMaxDb) {
          if (displayMaxDb <= 24.0f) return 6.0f;
          if (displayMaxDb <= 72.0f) return 12.0f;
          if (displayMaxDb <= 144.0f) return 24.0f;
          return 48.0f;
      }

      void DrawCenteredText''')

          replace_once(page,
          '''    void Push(float value) {
          values[writePos] = ImClamp(value, 0.0f, kGrMaxDb);
          writePos = (writePos + 1) % kGrHistoryCapacity;
          if (count < kGrHistoryCapacity) ++count;
      }

      float AtOldestOffset(int i) const {
          const int start = (writePos - count + kGrHistoryCapacity) % kGrHistoryCapacity;
          return values[(start + i) % kGrHistoryCapacity];
      }''',
          '''    void Push(float value) {
          if (!std::isfinite(value)) value = 0.0f;
          values[writePos] = ImClamp(value, 0.0f, kGrHardMaxDb);
          writePos = (writePos + 1) % kGrHistoryCapacity;
          if (count < kGrHistoryCapacity) ++count;
      }

      float AtOldestOffset(int i) const {
          const int start = (writePos - count + kGrHistoryCapacity) % kGrHistoryCapacity;
          return values[(start + i) % kGrHistoryCapacity];
      }

      float Maximum() const {
          float maximum = 0.0f;
          for (int i = 0; i < count; ++i)
              maximum = (std::max)(maximum, AtOldestOffset(i));
          return maximum;
      }''')

          replace_once(page,
          '''void DrawGrBar(const char* id, float reductionDb, const ImVec2& size) {''',
          '''void DrawGrBar(const char* id, float reductionDb, float displayMaxDb,
                     const ImVec2& size) {''')
          replace_once(page,
          '''    const float norm = ImClamp(reductionDb / kGrMaxDb, 0.0f, 1.0f);''',
          '''    displayMaxDb = (std::max)(kGrBaseMaxDb, displayMaxDb);
          const float norm = ImClamp(reductionDb / displayMaxDb, 0.0f, 1.0f);''')

          old_scale_start = text = Path(page).read_text(encoding="utf-8")
          start = text.index("void DrawGrScale(")
          end = text.index("\nvoid DrawMeterBank(", start)
          new_scale = r'''void DrawGrScale(float x, float top, float height, float currentGr,
                       float displayMaxDb) {
          ImDrawList* dl = ImGui::GetWindowDrawList();
          displayMaxDb = ImClamp(displayMaxDb, kGrBaseMaxDb, kGrHardMaxDb);
          const float tickStep = GrTickStep(displayMaxDb);

          float ticks[16]{};
          int tickCount = 0;
          for (float db = 0.0f;
               db < displayMaxDb - 0.01f && tickCount < 15;
               db += tickStep) {
              ticks[tickCount++] = db;
          }
          ticks[tickCount++] = displayMaxDb;

          const float fontH = ImGui::GetFontSize();
          const float minGap = fontH + 2.0f;
          const float minCenter = top + fontH * 0.5f;
          const float maxCenter = top + height - fontH * 0.5f;
          const float live = ImClamp(currentGr, 0.0f, displayMaxDb);
          const float liveExactY = top + height * (live / displayMaxDb);
          const float liveCenter = ImClamp(liveExactY, minCenter, maxCenter);

          const ImU32 textColor = ImGui::GetColorU32(
              ImVec4(0.43f, 0.46f, 0.51f, 0.9f));
          const ImU32 leaderColor = ImGui::GetColorU32(
              ImVec4(0.30f, 0.33f, 0.38f, 0.72f));
          const ImU32 liveColor = ImGui::GetColorU32(
              ImVec4(0.94f, 0.68f, 0.16f, 1.0f));

          float desired[16]{};
          bool visible[16]{};
          for (int i = 0; i < tickCount; ++i) {
              desired[i] = top + height * (ticks[i] / displayMaxDb);
              desired[i] = ImClamp(desired[i], minCenter, maxCenter);
              visible[i] = true;
              if (std::fabs(desired[i] - liveCenter) < minGap * 0.92f &&
                  std::fabs(ticks[i] - live) > 0.05f) {
                  visible[i] = false;
              }
          }

          for (int i = 0; i < tickCount; ++i) {
              if (std::fabs(ticks[i] - live) <= 0.05f) visible[i] = false;
          }

          for (int i = 0; i < tickCount; ++i) {
              dl->AddLine(ImVec2(x - 5.0f, desired[i]),
                          ImVec2(x - 1.0f, desired[i]), leaderColor, 1.0f);
              if (!visible[i]) continue;
              char text[16];
              std::snprintf(text, sizeof(text), "%.0f", ticks[i]);
              dl->AddText(ImVec2(x + 4.0f, desired[i] - fontH * 0.5f),
                          textColor, text);
          }

          char liveText[16];
          const float liveValue = (std::max)(0.0f,
              std::isfinite(currentGr) ? currentGr : 0.0f);
          std::snprintf(liveText, sizeof(liveText),
                        liveValue < 10.0f ? "%.1f" : "%.0f", liveValue);
          dl->AddLine(ImVec2(x - 8.0f, liveExactY),
                      ImVec2(x + 1.0f, liveExactY), liveColor, 1.5f);
          dl->AddText(ImVec2(x + 4.0f, liveCenter - fontH * 0.5f),
                      liveColor, liveText);
      }
'''
          Path(page).write_text(text[:start] + new_scale + text[end:], encoding="utf-8")

          replace_once(page,
          '''void DrawMeterBank(float inL, float inR, float gr, float outL, float outR,
                     float height) {''',
          '''void DrawMeterBank(float inL, float inR, float gr, float outL, float outR,
                     float height, float grDisplayMaxDb) {''')
          replace_once(page,
          '''    const float scaleWidth = ImGui::CalcTextSize("-60").x + 8.0f;''',
          '''    const float scaleWidth = ImGui::CalcTextSize("-240").x + 8.0f;''')
          replace_once(page,
          '''        DrawGrBar("##gain_reduction", gr, ImVec2(barW, height));
          DrawGrScale(screen.x + barW + scaleGap, screen.y, height, gr);''',
          '''        DrawGrBar("##gain_reduction", gr, grDisplayMaxDb,
                    ImVec2(barW, height));
          DrawGrScale(screen.x + barW + scaleGap, screen.y, height, gr,
                      grDisplayMaxDb);''')
          replace_once(page,
          '''        const float db = ImClamp(gr, 0.0f, kGrMaxDb);''',
          '''        const float db = (std::max)(0.0f,
              std::isfinite(gr) ? gr : 0.0f);''')

          replace_once(page,
          '''void DrawHistory(GrHistory& history, bool telemetryAvailable, float currentGr) {''',
          '''void DrawHistory(GrHistory& history, bool telemetryAvailable, float currentGr,
                       float grDisplayMaxDb) {''')
          replace_once(page,
          '''    const float ticks[] = { 0.0f, 3.0f, 6.0f, 12.0f, 18.0f, 24.0f };
          for (float db : ticks) {
              const float y = top + plotH * (db / kGrMaxDb);
              dl->AddLine(ImVec2(left, y), ImVec2(right, y),
                          ImGui::GetColorU32(ImVec4(0.16f, 0.18f, 0.22f, 1.0f)), 1.0f);
              char label[16];
              std::snprintf(label, sizeof(label), db == 0.0f ? "0" : "-%.0f", db);
              dl->AddText(ImVec2(p.x + 7.0f, y - ImGui::GetFontSize() * 0.5f),
                          ImGui::GetColorU32(ImVec4(0.43f, 0.46f, 0.51f, 0.9f)), label);
          }''',
          '''    grDisplayMaxDb = ImClamp(grDisplayMaxDb,
                                  kGrBaseMaxDb, kGrHardMaxDb);
          const float tickStep = GrTickStep(grDisplayMaxDb);
          auto drawHistoryTick = [&](float db) {
              const float y = top + plotH * (db / grDisplayMaxDb);
              dl->AddLine(ImVec2(left, y), ImVec2(right, y),
                          ImGui::GetColorU32(ImVec4(0.16f, 0.18f, 0.22f, 1.0f)), 1.0f);
              char label[16];
              std::snprintf(label, sizeof(label), db == 0.0f ? "0" : "-%.0f", db);
              dl->AddText(ImVec2(p.x + 7.0f, y - ImGui::GetFontSize() * 0.5f),
                          ImGui::GetColorU32(ImVec4(0.43f, 0.46f, 0.51f, 0.9f)), label);
          };
          for (float db = 0.0f; db < grDisplayMaxDb - 0.01f; db += tickStep)
              drawHistoryTick(db);
          drawHistoryTick(grDisplayMaxDb);''')
          replace_once(page,
          '''            const float y = top + plotH * (ImClamp(histGr, 0.0f, kGrMaxDb) / kGrMaxDb);''',
          '''            const float y = top + plotH *
                  (ImClamp(histGr, 0.0f, grDisplayMaxDb) / grDisplayMaxDb);''')

          replace_once(page,
          '''    UpdateMeterVisualState(meterVisuals, telemetryAvailable,
                             inL, inR, gr, outL, outR);

      const float availableWidth''',
          '''    UpdateMeterVisualState(meterVisuals, telemetryAvailable,
                             inL, inR, gr, outL, outR);
      const float grDisplayMaxDb = SelectGrDisplayMax((std::max)(
          gr, (std::max)(meterVisuals.gr, history.Maximum())));

      const float availableWidth''')
          replace_once(page,
          '''        DrawMeterBank(meterVisuals.inL, meterVisuals.inR, meterVisuals.gr,
                        meterVisuals.outL, meterVisuals.outR, meterHeight);''',
          '''        DrawMeterBank(meterVisuals.inL, meterVisuals.inR, meterVisuals.gr,
                        meterVisuals.outL, meterVisuals.outR, meterHeight,
                        grDisplayMaxDb);''')
          replace_once(page,
          '''    DrawHistory(history, telemetryAvailable, gr);''',
          '''    DrawHistory(history, telemetryAvailable, gr, grDisplayMaxDb);''')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "LexonBlackzz"
          git config user.email "98592761+LexonBlackzz@users.noreply.github.com"
          git add src/V3/SVMSLimiter.h src/V3/Configurator/PageLimiter.cpp
          git commit -m "dsp(v3): calm adaptive limiter recovery"
          git push origin HEAD:v3
