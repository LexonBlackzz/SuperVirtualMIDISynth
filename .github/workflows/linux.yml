name: Linux

on:
  workflow_dispatch:
  push:
    branches: [v3, main]
    paths:
      - ".github/workflows/linux.yml"
      - "build_v3_linux.sh"
      - "src/V3/**"
  pull_request:
    paths:
      - ".github/workflows/linux.yml"
      - "build_v3_linux.sh"
      - "src/V3/**"

jobs:
  ubuntu-18-04:
    name: Ubuntu 18.04 binary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ccache directory lives in the workspace so the container can use it.
      # Restore and save are separate steps so a failing build or test run
      # still saves what it compiled (actions/cache saves only on success).
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: linux-bionic-ccache-${{ github.sha }}
          restore-keys: linux-bionic-ccache-

      # Build inside Bionic so the artifact keeps its older glibc/libstdc++
      # floor. The Actions JavaScript runtime remains on the modern host.
      - name: Build and test in Ubuntu 18.04
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e CCACHE_DIR=/work/.ccache \
            -e CCACHE_MAXSIZE=500M \
            ubuntu:18.04 \
            bash -euxo pipefail -c '
              # Root-owned cache files must stay readable for the host-side save,
              # whether or not the build and tests pass.
              trap "chmod -R a+rwX .ccache 2>/dev/null || true" EXIT
              apt-get -o Acquire::Retries=5 update
              DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y \
                build-essential ca-certificates ccache ninja-build libasound2-dev wget
              wget -q https://github.com/Kitware/CMake/releases/download/v3.27.9/cmake-3.27.9-linux-x86_64.tar.gz
              tar -xzf cmake-3.27.9-linux-x86_64.tar.gz -C /opt
              export PATH=/opt/cmake-3.27.9-linux-x86_64/bin:$PATH
              cmake -S src/V3 -B build/V3-linux-bionic -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DSVMS_BUILD_TESTS=ON \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
              ccache -z
              cmake --build build/V3-linux-bionic --parallel
              ccache -s
              ctest --test-dir build/V3-linux-bionic --output-on-failure
              build/V3-linux-bionic/bin/svmsd --help
              mkdir -p build/SVMS-V3-linux-x86_64
              cp build/V3-linux-bionic/bin/svmsd \
                 build/V3-linux-bionic/bin/svms_v3_render \
                 build/SVMS-V3-linux-x86_64/
              cp build/V3-linux-bionic/libOmniMIDI.so \
                 build/V3-linux-bionic/libsvmsapi.so \
                 build/SVMS-V3-linux-x86_64/
              cp src/V3/LINUX.md build/SVMS-V3-linux-x86_64/README.md
              tar -C build -czf build/SVMS-V3-linux-x86_64-ubuntu18.04.tar.gz \
                SVMS-V3-linux-x86_64
            '

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: linux-bionic-ccache-${{ github.sha }}

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: SVMS-V3-linux-x86_64-ubuntu18.04
          path: build/SVMS-V3-linux-x86_64-ubuntu18.04.tar.gz
          if-no-files-found: error
