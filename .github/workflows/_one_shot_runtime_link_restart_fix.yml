name: One-shot RuntimeLink restart fix

on:
  push:
    branches:
      - runtime-link-restart-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch RuntimeLink restart handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/V3/SVMSRuntimeLink.h')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''    // Creates the per-PID mapping/mutex/event and registers this\n    // process in the hosts registry.  Non-fatal: returns false without\n    // touching anything when the objects already exist (PID reuse) or\n    // a system call fails.''',
                  '''    // Creates or reclaims the per-PID mapping/mutex/event and registers\n    // this process in the hosts registry. Other processes may keep the named\n    // objects alive across a transient MIDI-driver shutdown, so reopening an\n    // existing object is expected and the new session republishes its state.'''
              ),
              (
                  '''        if (!hMap_ || GetLastError() == ERROR_ALREADY_EXISTS) {\n            if (hMap_) { CloseHandle(hMap_); hMap_ = nullptr; }\n            return false;\n        }''',
                  '''        if (!hMap_) return false;'''
              ),
              (
                  '''        hMutex_ = CreateMutexW(nullptr, FALSE, mutexName);\n        if (!hMutex_ || GetLastError() == ERROR_ALREADY_EXISTS) {\n            if (hMutex_) { CloseHandle(hMutex_); hMutex_ = nullptr; }\n            Shutdown();\n            return false;\n        }''',
                  '''        hMutex_ = CreateMutexW(nullptr, FALSE, mutexName);\n        if (!hMutex_) {\n            Shutdown();\n            return false;\n        }'''
              ),
              (
                  '''        hCmdEvent_ = CreateEventW(nullptr, FALSE, FALSE, evtName);\n        if (!hCmdEvent_ || GetLastError() == ERROR_ALREADY_EXISTS) {\n            if (hCmdEvent_) { CloseHandle(hCmdEvent_); hCmdEvent_ = nullptr; }\n            Shutdown();\n            return false;\n        }''',
                  '''        hCmdEvent_ = CreateEventW(nullptr, FALSE, FALSE, evtName);\n        if (!hCmdEvent_) {\n            Shutdown();\n            return false;\n        }'''
              ),
              (
                  '''        if (!v3Map_ || GetLastError() == ERROR_ALREADY_EXISTS) {\n            ShutdownV3();\n            return false;\n        }''',
                  '''        if (!v3Map_) {\n            ShutdownV3();\n            return false;\n        }'''
              ),
              (
                  '''        v3Mutex_ = CreateMutexW(nullptr, FALSE, mutexName);\n        if (!v3Mutex_ || GetLastError() == ERROR_ALREADY_EXISTS) {\n            ShutdownV3();\n            return false;\n        }\n        v3CmdEvent_ = CreateEventW(nullptr, FALSE, FALSE, evtName);\n        if (!v3CmdEvent_ || GetLastError() == ERROR_ALREADY_EXISTS) {\n            ShutdownV3();\n            return false;\n        }''',
                  '''        v3Mutex_ = CreateMutexW(nullptr, FALSE, mutexName);\n        if (!v3Mutex_) {\n            ShutdownV3();\n            return false;\n        }\n        v3CmdEvent_ = CreateEventW(nullptr, FALSE, FALSE, evtName);\n        if (!v3CmdEvent_) {\n            ShutdownV3();\n            return false;\n        }'''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          git diff --check
          git diff -- src/V3/SVMSRuntimeLink.h

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "LexonBlackzz"
          git config user.email "98592761+LexonBlackzz@users.noreply.github.com"
          git rm .github/workflows/_one_shot_runtime_link_restart_fix.yml
          git add src/V3/SVMSRuntimeLink.h
          git commit -m "Fix RuntimeLink reconnect after driver reset"
          git push origin HEAD:runtime-link-restart-fix
